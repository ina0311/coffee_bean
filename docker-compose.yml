version: '3.8'

services:
  api: &api-base
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    working_dir: /api
    environment:
      - NODE_ENV=${NODE_ENV}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_PORT=${MYSQL_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - TZ=${TZ}
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./api:/api
      - ./common:/common
      - api_node_modules:/api/node_modules
    command: npm run dev
    tty: true
    profiles:
      - base

  api-dev:
    <<: *api-base
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - dev

  web: &web-base
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    working_dir: /web
    volumes:
      - ./web:/web
      - ./common:/common
      - web_node_modules:/web/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=${NODE_ENV}
      - VITE_API_URL=${VITE_API_URL}
      - TZ=${TZ}
    command: npm run dev
    tty: true
    profiles:
      - base

  web-dev:
    <<: *web-base
    depends_on:
      api-dev:
        condition: service_started
      db:
        condition: service_healthy
    profiles:
      - dev

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    hostname: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${TZ}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  api_node_modules:
  web_node_modules:
